    get:
      summary: "List Staff records (create, read, update, delete)"
      tags: [Staff]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Staff' } }
    post:
      summary: "Create a Staff"
      tags: [Staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Staff' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '403': { description: Forbidden for this role }
        '422': { description: Validation error }
  /staff/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
