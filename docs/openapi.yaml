openapi: 3.0.3
info:
  title: StructFlow API
  version: 1.0.0
  description: Generated from src/design-system/backendSpec.js. Bearer JWT auth. Role scoping (admin, member) is enforced server-side.
servers:
  - url: http://localhost:4000/api
security:
