        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '404': { description: Not found or not visible to this role }
    patch:
      summary: "Update a Staff (partial)"
      tags: [Staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Staff' }
      responses:
        '200': { description: Updated }
        '403': { description: Forbidden for this role }
    delete:
