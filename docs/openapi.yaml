components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Staff:
      type: object
      required: [name, role, department, email, status]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        role:
          type: string
          description: "Job title, e.g. Senior Structural Engineer"
        department:
          type: string
          enum: [Engineering, Management, Drafting, Administration]
        email:
          type: string
        phone:
          type: string
        avatar:
          type: string
          description: "Initials fallback. Photos are served from avatarUrl when present."
        hourlyRate:
          type: number
          description: "Internal cost rate. Never returned to members."
        monthlySalary:
          type: number
          description: "Admin only."
        joinDate:
          type: string
          format: date
        status:
          type: string
          enum: [active, inactive]
        skills:
          type: array
          items: { type: string }
    Client:
      type: object
      required: [name, contact]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        contact:
          type: string
        email:
          type: string
        phone:
          type: string
    ProjectStage:
      type: object
      required: [name, order]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        order:
          type: integer
          description: "Stored in the SQL column sort_order because ORDER is reserved."
        optional:
          type: boolean
    Project:
      type: object
      required: [name, clientId, type, location, priority, status, contractValue, managerId]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        clientId:
          type: string
        type:
          type: string
          enum: [Residential, Commercial, Industrial, Institutional, Infrastructure]
        location:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [planning, in-progress, on-hold, completed]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        contractValue:
          type: number
          description: "Admin only. Omit from member responses."
        description:
          type: string
        managerId:
          type: string
        teamIds:
          type: array
          items: { type: string }
          description: "Members of the project team (manager excluded)."
        currentStage:
          type: string
        progress:
          type: integer
          readOnly: true
          description: "0-100, computed from currentStage order."
    Task:
      type: object
      required: [title, projectId, assigneeId, status, priority, type]
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
        description:
          type: string
        projectId:
          type: string
        assigneeId:
          type: string
        reporterId:
          type: string
        status:
          type: string
          enum: [backlog, todo, in-progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        type:
          type: string
          enum: [design, drafting, review, analysis, estimation, report, site-visit, coordination]
        createdDate:
          type: string
          format: date
          readOnly: true
        dueDate:
          type: string
          format: date
        completedDate:
          type: string
          format: date
          readOnly: true
          description: "Set by the server when status becomes done."
        estimatedHours:
          type: number
        loggedHours:
          type: number
          readOnly: true
          description: "Sum of TimeLog.hours for this task."
        tags:
          type: array
          items: { type: string }
        milestoneId:
          type: string
          description: "The milestone this task counts toward. Tasks carry no money: the milestone owns the payment."
    TaskComment:
      type: object
      required: [taskId, type, authorName, text]
      properties:
        id:
          type: string
          readOnly: true
        taskId:
          type: string
        type:
          type: string
          enum: [comment, system]
        authorId:
          type: string
        authorName:
          type: string
          description: "Snapshot so history survives staff edits."
        text:
          type: string
          description: "@FirstName mentions are plain text. Parse server-side to notify."
        edited:
          type: boolean
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
    TaskAttachment:
      type: object
      required: [taskId, name, size]
      properties:
        id:
          type: string
          readOnly: true
        taskId:
          type: string
        name:
          type: string
        size:
          type: integer
          description: "Bytes. Limit 10 MB per file, 10 files per task."
        mimeType:
          type: string
        url:
          type: string
          readOnly: true
        addedById:
          type: string
        addedAt:
          type: string
          format: date-time
          readOnly: true
    TimeLog:
      type: object
      required: [staffId, projectId, taskId, date, hours]
      properties:
        id:
          type: string
          readOnly: true
        staffId:
          type: string
        projectId:
          type: string
        taskId:
          type: string
        date:
          type: string
          format: date
        hours:
          type: number
          description: "0.5 to 12 per entry."
        description:
          type: string
    Milestone:
      type: object
      required: [projectId, name, weightage, status, dueDate, paymentAmount, paymentStatus, paymentMode]
      properties:
        id:
          type: string
          readOnly: true
        projectId:
          type: string
        name:
          type: string
        weightage:
          type: integer
          description: "Percent of contract value. Sum per project should be 100."
        status:
          type: string
          enum: [pending, in-progress, completed]
        dueDate:
          type: string
          format: date
        completedDate:
          type: string
          format: date
          readOnly: true
        paymentAmount:
          type: number
        paymentStatus:
          type: string
          enum: [pending, ready, invoiced, paid]
          description: "pending until its tasks are done, ready (waiting for admin approval), invoiced (request sent), paid."
        paymentMode:
          type: string
          enum: [auto, manual]
          description: "auto sends the payment request when the last linked task is done; manual sets paymentStatus=ready for an admin to approve."
    ProjectFile:
      type: object
      required: [projectId, name, folder]
      properties:
        id:
          type: string
          readOnly: true
        projectId:
          type: string
        name:
          type: string
        folder:
          type: string
          enum: [Drawings, Reports, Estimates, Contracts, "Site Photos", Correspondence, Specifications]
        type:
          type: string
          description: "File extension without dot."
        size:
          type: integer
          description: "Bytes."
        uploadedBy:
          type: string
        date:
          type: string
          format: date
          readOnly: true
        url:
          type: string
          readOnly: true
    Activity:
      type: object
      required: [type, message]
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
        userId:
          type: string
        projectId:
          type: string
        taskId:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
    User:
      type: object
      required: [email, passwordHash, role]
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
        passwordHash:
          type: string
          writeOnly: true
          description: "bcrypt or argon2. Never returned."
        role:
          type: string
          enum: [admin, member]
        staffId:
          type: string
